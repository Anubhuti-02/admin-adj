<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Settings - Datalogger</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/pages/configuration.css">
</head>
<body>
    <div class="container">
        <div class="config-card">
            <h1>Route Settings</h1>
            <p class="subtitle">Set the origin and destination stations for this deployment — every generated report filename will be tagged with this route</p>

            <!-- Current Configuration Display -->
            <div class="current-config" id="currentConfig">
                <h4><i class="fas fa-check-circle"></i> Current Active Route</h4>
                <div class="config-badges" id="routeBadges">
                    <!-- Populated by JavaScript -->
                </div>
            </div>

            <!-- Route Section -->
            <div class="threshold-section">
                <div class="section-title">
                    <i class="fas fa-route"></i>
                    <h2>Route</h2>
                </div>

                <div class="threshold-input">
                    <label>Origin Station Code</label>
                    <input type="text" id="originCode" placeholder="e.g. NDLS" maxlength="10">
                </div>
                <div class="threshold-input">
                    <label>Destination Station Code</label>
                    <input type="text" id="destinationCode" placeholder="e.g. LJN" maxlength="10">
                </div>
            </div>

            <!-- Section Metadata Display -->
            <div class="current-config" id="sectionCurrentConfig">
                <h4><i class="fas fa-check-circle"></i> Current Section Metadata</h4>
                <div class="config-badges" id="sectionBadges">
                    <!-- Populated by JavaScript -->
                </div>
            </div>

            <!-- Section Metadata -->
            <div class="threshold-section">
                <div class="section-title">
                    <i class="fas fa-map-signs"></i>
                    <h2>Section Metadata</h2>
                </div>

                <div class="threshold-input">
                    <label>Railway</label>
                    <input type="text" id="railwayName" placeholder="e.g. Northern Eastern">
                </div>
                <div class="threshold-input">
                    <label>Division Code</label>
                    <input type="text" id="divisionCode" placeholder="e.g. 28">
                </div>
                <div class="threshold-input">
                    <label>Division</label>
                    <input type="text" id="divisionName" placeholder="e.g. Lucknow">
                </div>
                <div class="threshold-input">
                    <label>Section</label>
                    <input type="text" id="sectionCode" placeholder="e.g. LJN-STP">
                </div>
                <div class="threshold-input">
                    <label>Line</label>
                    <input type="text" id="lineCode" placeholder="e.g. SL">
                </div>
                <div class="threshold-input">
                    <label>Block</label>
                    <input type="text" id="blockCode" placeholder="e.g. 1">
                </div>
                <div class="threshold-input">
                    <label>Rail: LH</label>
                    <input type="text" id="railLH" placeholder="e.g. Kg52">
                </div>
                <div class="threshold-input">
                    <label>Rail: RH</label>
                    <input type="text" id="railRH" placeholder="e.g. Kg52">
                </div>
            </div>

            <!-- Validation Error -->
            <div id="validationError" class="validation-error">
                <i class="fas fa-exclamation-triangle"></i> <span></span>
            </div>

            <!-- Save Buttons -->
            <div class="save-section">
                <button class="btn btn-secondary" onclick="clearAll()">
                    <i class="fas fa-undo"></i> Clear All
                </button>
                <button class="btn btn-primary" onclick="saveAllConfig()">
                    <i class="fas fa-save"></i> Save Configuration
                </button>
            </div>

            <!-- Success Message -->
            <div id="successMessage" class="success-message">
                <i class="fas fa-check-circle"></i> Saved — new reports will be tagged with this route and section metadata.
            </div>
        </div>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/pages/route-settings.js"></script>
</body>
</html>
